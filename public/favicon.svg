<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Vibrant Amazon Orange Tile Gradient -->
    <linearGradient id="apBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="35%" stop-color="#FB8500" />
      <stop offset="75%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Deep Navy / Cyber Border Gradient -->
    <linearGradient id="apBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFE4B5" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>

    <!-- Dark Center Shield Gradient -->
    <linearGradient id="apShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128" />
      <stop offset="50%" stop-color="#07132B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Bright Tool Chrome / White Gradient -->
    <linearGradient id="apToolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Electric Cyan Accent -->
    <linearGradient id="apCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="apShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base App Tile: VIBRANT AMAZON ORANGE -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#apBgGrad)" filter="url(#apShadow)" />
  <!-- Radiant Rim Accent -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#apBorderGrad)" stroke-width="18" />

  <!-- Inner High-Contrast Navy Squircle Shield -->
  <rect x="76" y="76" width="360" height="360" rx="72" fill="url(#apShieldGrad)" stroke="#38BDF8" stroke-width="8" filter="url(#apShadow)" />

  <!-- Code / DevOps Chevrons in Background (< / >) -->
  <path d="M 148 200 L 110 242 L 148 284" fill="none" stroke="#38BDF8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 364 200 L 402 242 L 364 284" fill="none" stroke="#38BDF8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Diagonal Chrome / White Wrench -->
  <g transform="translate(256, 240) rotate(-42) translate(-256, -240)">
    <!-- Wrench shaft -->
    <rect x="238" y="145" width="36" height="200" rx="18" fill="url(#apToolGrad)" stroke="#94A3B8" stroke-width="3" />
    <!-- Top Open Wrench Head -->
    <circle cx="256" cy="145" r="50" fill="url(#apToolGrad)" stroke="#94A3B8" stroke-width="3" />
    <!-- Open Jaw Cutout -->
    <polygon points="256,115 240,140 272,140" fill="#07132B" />
    <!-- Bottom Ring Head -->
    <circle cx="256" cy="345" r="36" fill="url(#apToolGrad)" stroke="#94A3B8" stroke-width="3" />
    <circle cx="256" cy="345" r="18" fill="#07132B" />
  </g>

  <!-- Glowing Emerald Fix Checkmark Badge in lower corner -->
  <g filter="url(#apShadow)">
    <circle cx="340" cy="340" r="54" fill="#061E16" stroke="#34D399" stroke-width="6" />
    <circle cx="340" cy="340" r="48" fill="#10B981" />
    <!-- White Checkmark -->
    <path d="M 320 340 L 334 354 L 364 322" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Top Accent Label -->
  <text x="256" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-size="28" font-weight="900" fill="#FF9900" text-anchor="middle" letter-spacing="4">/APPFIX</text>
</svg>