<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Navy to Vibrant Emerald Tile Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07132B" />
      <stop offset="40%" stop-color="#003D27" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Multi-Color Vibrant Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>

    <!-- Bright Amazon Orange Tool Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="45%" stop-color="#FB8500" />
      <stop offset="100%" stop-color="#E85D04" />
    </linearGradient>

    <!-- Vibrant Mint/Emerald Badge Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Cyan Highlight Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle with Heavy Drop Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#shadow)" />
  <!-- Colorful Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="14" />

  <!-- Code / DevOps Chevrons in Background (< / >) -->
  <path d="M 130 185 L 85 230 L 130 275" fill="none" stroke="#38BDF8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />
  <path d="M 382 185 L 427 230 L 382 275" fill="none" stroke="#38BDF8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />

  <!-- Central Diagonal Amazon Orange Wrench -->
  <g transform="translate(256, 215) rotate(-38) translate(-256, -215)">
    <!-- Wrench shaft -->
    <rect x="236" y="130" width="40" height="210" rx="20" fill="url(#orangeGrad)" stroke="#FFE3A8" stroke-width="3" />
    <!-- Top Wrench Head -->
    <circle cx="256" cy="130" r="54" fill="url(#orangeGrad)" stroke="#FFE3A8" stroke-width="3" />
    <!-- Top Cutout Slot -->
    <polygon points="256,100 240,126 272,126" fill="#061F17" />
    <!-- Bottom Ring Head -->
    <circle cx="256" cy="340" r="38" fill="url(#orangeGrad)" />
    <circle cx="256" cy="340" r="18" fill="#061F17" />
  </g>

  <!-- Prominent Glowing Emerald "Fix Verified" Checkmark Badge -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="345" r="82" fill="#061E16" stroke="#34D399" stroke-width="8" />
    <circle cx="256" cy="345" r="74" fill="url(#emeraldGrad)" />
    <!-- Crisp White Checkmark -->
    <path d="M 224 345 L 246 367 L 292 318" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Neon Sparks & Corner Highlights -->
  <!-- Top Gold Diamond Star -->
  <polygon points="256,48 265,72 289,81 265,90 256,114 247,90 223,81 247,72" fill="#FDE047" />
  <!-- Cyan Spark -->
  <circle cx="95" cy="95" r="12" fill="#38BDF8" />
  <polygon points="95,80 98,92 110,95 98,98 95,110 92,98 80,95 92,92" fill="#FFFFFF" />
  <!-- Amazon Orange Spark -->
  <circle cx="417" cy="95" r="12" fill="#FF9900" />
  <polygon points="417,80 420,92 432,95 420,98 417,110 414,98 402,95 414,92" fill="#FFFFFF" />
</svg>
